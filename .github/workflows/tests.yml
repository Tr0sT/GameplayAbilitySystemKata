name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: NUnit (${{ matrix.configuration }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '6.0.x'
      - name: Restore
        run: dotnet restore AbilitySystemSolution.sln
      - name: Build and test
        run: dotnet test AbilitySystemSolution.sln --no-restore --configuration ${{ matrix.configuration }} --logger 'console;verbosity=normal'
